[workspace]
members = [ "benchmarks", "roaring" ]
resolver = "2"

[workspace.dependencies]
roaring = { path = "roaring" }

bytemuck = "1.25.2"
byteorder = "1.5.0"
criterion = "0.5"
git2 = { version = "0.21", default-features = false }
indicatif = "0.17"
itertools = "0.15"
postcard = { version = "1.1", features = [ "alloc" ] }
proptest = "1.6.0"
serde = "1.0.229"
serde_json = "1.0.145"
zip = { version = "0.6", default-features = false }

[profile.test]
opt-level = 2
