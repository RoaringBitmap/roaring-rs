[workspace]
members = [ "benchmarks", "roaring" ]
resolver = "2"

[workspace.dependencies]
roaring = { path = "roaring" }

bytemuck = "1.25.2"
byteorder = "1.5.0"
criterion = "0.8.2"
fearless_simd = { version = "1.2.0", default-features = false }
fearless_simd_macros = "0.1.0"
git2 = { version = "0.21.0", default-features = false }
indicatif = "0.18.6"
itertools = "0.15.0"
postcard = { version = "1.1.3", features = [ "alloc" ] }
proptest = "1.12.0"
serde = "1.0.229"
serde_json = "1.0.154"
zip = { version = "9.1.3", default-features = false }

[profile.test]
opt-level = 2
